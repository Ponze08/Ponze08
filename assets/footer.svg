    <stop offset="55%" stop-color="#8B5CF6"/>
    <stop offset="100%" stop-color="#22D3EE"/>
  </linearGradient>
  <radialGradient id="halo" cx="50%" cy="50%" r="50%">
    <stop offset="0%" stop-color="#8B5CF6" stop-opacity=".22"/>
